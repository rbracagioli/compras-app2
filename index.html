<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F2ED;--card:#FFFFFF;--border:#E2DDD6;--text:#1A1714;--muted:#7A756E;
  --accent:#2D6A4F;--accent-light:#E8F4EE;--danger:#C0392B;
  --warn-bg:#FFF8E1;--warn:#8B6914;--radius:12px;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;max-width:420px;margin:0 auto}
h1{font-size:22px;font-weight:600}h2{font-size:16px;font-weight:600}
.screen{display:none;flex-direction:column;min-height:100vh;padding-bottom:72px}
.screen.active{display:flex}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 12px;background:var(--bg);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border)}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:20}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;font-size:10px;color:var(--muted);border:none;background:none;cursor:pointer;font-family:var(--font);transition:color .15s}
.bnav-btn.active{color:var(--accent);font-weight:600}
.bnav-btn svg{width:22px;height:22px;stroke-width:1.8;fill:none;stroke:currentColor}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:14px 16px;margin:0 16px 10px}
.card-sm{background:var(--card);border-radius:8px;border:1px solid var(--border);padding:10px 12px;margin-bottom:8px}
input,select{font-family:var(--font);font-size:14px;width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--card);color:var(--text);outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--accent)}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;margin-top:10px}
label:first-child{margin-top:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font);font-size:14px;font-weight:500;padding:10px 16px;border-radius:8px;border:none;cursor:pointer;transition:opacity .15s}
.btn:active{opacity:.8}
.btn-primary{background:var(--accent);color:#fff;width:100%}
.btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid #EEC5C2;font-size:12px;padding:6px 10px;border-radius:6px}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px}
.item-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.item-row:last-child{border-bottom:none}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
.section{padding:14px 0 6px}
.divider{height:1px;background:var(--border);margin:12px 0}
.scroll-area{flex:1;overflow-y:auto;padding-top:4px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:420px;padding:20px 20px 32px;animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px}

/* AUTOCOMPLETE */
.ac-wrap{position:relative}
.ac-input-box{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;background:var(--card);transition:border-color .15s;overflow:hidden}
.ac-input-box.focused{border-color:var(--accent)}
.ac-input-box.selected{border-color:var(--accent);background:var(--accent-light)}
.ac-input-box input{border:none;background:transparent;padding:10px 12px;flex:1;font-size:14px;color:var(--text)}
.ac-input-box input:focus{outline:none}
.ac-clear{background:none;border:none;padding:0 12px;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;flex-shrink:0}
.ac-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:200;max-height:240px;overflow-y:auto;display:none}
.ac-dropdown.open{display:block}
.ac-group-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 12px 4px}
.ac-item{padding:10px 12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .1s}
.ac-item:hover,.ac-item.active{background:var(--accent-light)}
.ac-item-name mark{background:none;color:var(--accent);font-weight:600}
.ac-item-forn{font-size:11px;color:var(--muted);white-space:nowrap;margin-left:8px;flex-shrink:0}
.ac-empty{padding:14px 12px;font-size:13px;color:var(--muted);text-align:center}
.forn-pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-light);border:1px solid #B8DECA;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:500;color:var(--accent);margin-top:8px}

/* GROUP HEADER — expansível */
.group-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;cursor:pointer;user-select:none}
.group-header-left{display:flex;align-items:center;gap:8px}
.group-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.group-count{font-size:10px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:1px 7px}
.group-chevron{transition:transform .2s;color:var(--muted)}
.group-chevron svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.group-chevron.open{transform:rotate(180deg)}
.group-info{display:none;padding:4px 16px 10px;gap:8px;flex-wrap:wrap}
.group-info.open{display:flex}
.group-info a{font-size:12px;color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:4px}

/* DASHBOARD */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:10px}
.dash-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:14px}
.dash-card-full{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:14px 16px;margin:0 16px 10px}
.dash-num{font-size:28px;font-weight:600;color:var(--accent);font-family:var(--mono);line-height:1}
.dash-label{font-size:11px;color:var(--muted);margin-top:4px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-row:last-child{margin-bottom:0}
.bar-name{font-size:12px;color:var(--text);width:90px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .5s ease}
.bar-pct{font-size:11px;color:var(--muted);width:32px;text-align:right;flex-shrink:0;font-family:var(--mono)}
</style>
</head>
<body>

<!-- TELA: LISTA -->
<div id="screen-lista" class="screen active">
  <div class="topbar">
    <div>
      <div style="font-size:11px;color:var(--muted);font-family:var(--mono)" id="topbar-date"></div>
      <h1>Lista do dia</h1>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="abrirRota()">🗺 Rota</button>
  </div>
  <div class="scroll-area" id="lista-content"></div>
  <div style="padding:12px 16px 4px">
    <button class="btn btn-primary" onclick="abrirModalAdicionar()">+ Adicionar insumo</button>
  </div>
</div>

<!-- TELA: DASHBOARD -->
<div id="screen-dash" class="screen">
  <div class="topbar"><h1>Resumo</h1></div>
  <div class="scroll-area" id="dash-content" style="padding-top:12px"></div>
</div>

<!-- TELA: CADASTROS -->
<div id="screen-cadastros" class="screen">
  <div class="topbar"><h1>Cadastros</h1></div>
  <div class="scroll-area" style="padding:0 16px">
    <div class="section">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h2>Fornecedores</h2>
        <button class="btn btn-ghost btn-sm" onclick="abrirModalFornecedor()">+ Novo</button>
      </div>
      <div id="lista-fornecedores"></div>
    </div>
    <div class="divider"></div>
    <div class="section">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h2>Insumos</h2>
        <button class="btn btn-ghost btn-sm" onclick="abrirModalInsumo()">+ Novo</button>
      </div>
      <div id="lista-insumos-cad"></div>
    </div>
  </div>
</div>

<!-- TELA: HISTÓRICO -->
<div id="screen-historico" class="screen">
  <div class="topbar"><h1>Histórico</h1></div>
  <div class="scroll-area" id="historico-content" style="padding:0 16px 12px"></div>
</div>

<nav class="bottomnav">
  <button class="bnav-btn active" onclick="ir('lista')" id="nav-lista">
    <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2m-6 9 2 2 4-4"/></svg>
    Lista
  </button>
  <button class="bnav-btn" onclick="ir('dash')" id="nav-dash">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Resumo
  </button>
  <button class="bnav-btn" onclick="ir('cadastros')" id="nav-cadastros">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
    Cadastros
  </button>
  <button class="bnav-btn" onclick="ir('historico')" id="nav-historico">
    <svg viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
    Histórico
  </button>
</nav>

<!-- MODAL: ADICIONAR -->
<div class="modal-overlay" id="modal-adicionar">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Adicionar à lista</div>
    <label>Insumo</label>
    <div class="ac-wrap">
      <div class="ac-input-box" id="ac-box">
        <input type="text" id="ac-input" placeholder="Digite para buscar..." autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="ac-clear" id="ac-clear" onclick="limparSelecao()" style="display:none">×</button>
      </div>
      <div class="ac-dropdown" id="ac-dropdown"></div>
    </div>
    <div id="forn-pill-wrap"></div>
    <label style="margin-top:12px">Quantidade (opcional)</label>
    <input id="inp-qtd" type="text" placeholder="ex: 5kg, 2cx, 1 saco">
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn btn-ghost" style="flex:1" onclick="fecharModal('modal-adicionar')">Cancelar</button>
      <button class="btn btn-primary" style="flex:1" onclick="adicionarItem()">Adicionar</button>
    </div>
  </div>
</div>

<!-- MODAL: FORNECEDOR -->
<div class="modal-overlay" id="modal-fornecedor">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-forn-title">Novo fornecedor</div>
    <label>Nome</label><input id="forn-nome" type="text" placeholder="ex: Hortifruti Central">
    <label>WhatsApp / Telefone (opcional)</label><input id="forn-tel" type="tel" placeholder="ex: 51 99999-0000">
    <label>Endereço ou link Maps (opcional)</label><input id="forn-end" type="text" placeholder="Rua X, 123 ou link do Maps">
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn btn-ghost" style="flex:1" onclick="fecharModal('modal-fornecedor')">Cancelar</button>
      <button class="btn btn-primary" style="flex:1" onclick="salvarFornecedor()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL: INSUMO -->
<div class="modal-overlay" id="modal-insumo">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Novo insumo</div>
    <label>Nome do insumo</label><input id="ins-nome" type="text" placeholder="ex: Mamão papaia">
    <label>Categoria (opcional)</label><input id="ins-cat" type="text" placeholder="ex: Frutas, Carnes, Laticínios">
    <label>Fornecedor padrão <span style="font-weight:400;color:var(--muted)">(opcional — pode definir depois)</span></label>
    <select id="ins-forn"><option value="">Sem fornecedor por enquanto</option></select>
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn btn-ghost" style="flex:1" onclick="fecharModal('modal-insumo')">Cancelar</button>
      <button class="btn btn-primary" style="flex:1" onclick="salvarInsumo()">Salvar</button>
    </div>
  </div>
</div>

<script>
const meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const diasSemana=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function uid(){return'x'+Math.random().toString(36).slice(2,8)}
function norm(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function hoje(){const d=new Date();return`${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`}
function fmtData(iso){const d=new Date(iso);return`${d.getDate()} ${meses[d.getMonth()]}`}
function fmtDia(iso){const d=new Date(iso);return diasSemana[d.getDay()]}

const DADOS_INICIAIS={
  fornecedores:[
    {id:'f1',nome:'Praça',tel:'',end:''},
    {id:'f2',nome:'Fornecedor',tel:'',end:''},
    {id:'f3',nome:'Mercado',tel:'',end:''},
    {id:'f4',nome:'Porto Alegre',tel:'',end:''},
    {id:'f5',nome:'Focatto',tel:'',end:''},
    {id:'f6',nome:'Santa Clara',tel:'',end:''},
    {id:'f7',nome:'Utensílios',tel:'',end:''},
  ],
  insumos:[
    {id:'i01',nome:'Pão de milho',cat:'Padaria',fornId:'f1'},
    {id:'i02',nome:'Pão de centeio',cat:'Padaria',fornId:'f1'},
    {id:'i03',nome:'Amora congelada',cat:'Frutas congeladas',fornId:'f2'},
    {id:'i04',nome:'Morango',cat:'Frutas congeladas',fornId:'f2'},
    {id:'i05',nome:'Açúcar refinado',cat:'Secos',fornId:'f3'},
    {id:'i06',nome:'Açúcar demerara',cat:'Secos',fornId:'f3'},
    {id:'i07',nome:'Açúcar mascavo',cat:'Secos',fornId:'f3'},
    {id:'i08',nome:'Essência de baunilha',cat:'Secos',fornId:'f3'},
    {id:'i09',nome:'Chocolate branco',cat:'Chocolates',fornId:'f3'},
    {id:'i10',nome:'Creme de leite',cat:'Laticínios',fornId:'f3'},
    {id:'i11',nome:'Creme culinário',cat:'Laticínios',fornId:'f3'},
    {id:'i12',nome:'Leite de coco',cat:'Secos',fornId:'f3'},
    {id:'i13',nome:'Coco ralado',cat:'Secos',fornId:'f3'},
    {id:'i14',nome:'Banana',cat:'Frutas',fornId:'f3'},
    {id:'i15',nome:'Maçã',cat:'Frutas',fornId:'f3'},
    {id:'i16',nome:'Limão taiti',cat:'Frutas',fornId:'f3'},
    {id:'i17',nome:'Limão siciliano',cat:'Frutas',fornId:'f3'},
    {id:'i18',nome:'Maracujá',cat:'Frutas',fornId:'f3'},
    {id:'i19',nome:'Espinafre',cat:'Hortaliças',fornId:'f3'},
    {id:'i20',nome:'Alho poró',cat:'Hortaliças',fornId:'f3'},
    {id:'i21',nome:'Pimentão',cat:'Hortaliças',fornId:'f3'},
    {id:'i22',nome:'Cenoura',cat:'Hortaliças',fornId:'f3'},
    {id:'i23',nome:'Cebola',cat:'Hortaliças',fornId:'f3'},
    {id:'i24',nome:'Salsinha',cat:'Ervas',fornId:'f3'},
    {id:'i25',nome:'Alecrim',cat:'Ervas',fornId:'f3'},
    {id:'i26',nome:'Presunto',cat:'Frios',fornId:'f3'},
    {id:'i27',nome:'Tomate cereja',cat:'Hortaliças',fornId:'f3'},
    {id:'i28',nome:'Gelatina sem sabor',cat:'Secos',fornId:'f3'},
    {id:'i29',nome:'Goiabada zero',cat:'Doces',fornId:'f3'},
    {id:'i30',nome:'Chocolate meio amargo zero',cat:'Chocolates',fornId:'f3'},
    {id:'i31',nome:'Chocolate branco zero',cat:'Chocolates',fornId:'f3'},
    {id:'i32',nome:'Açúcar de baunilha',cat:'Secos',fornId:'f4'},
    {id:'i33',nome:'Uva passa',cat:'Secos',fornId:'f4'},
    {id:'i34',nome:'Damasco',cat:'Secos',fornId:'f4'},
    {id:'i35',nome:'Ameixa seca',cat:'Secos',fornId:'f4'},
    {id:'i36',nome:'Xerém de caju',cat:'Secos',fornId:'f4'},
    {id:'i37',nome:'Canela em pó',cat:'Especiarias',fornId:'f4'},
    {id:'i38',nome:'Croissant de frango',cat:'Padaria',fornId:'f5'},
    {id:'i39',nome:'Pastel de nata',cat:'Padaria',fornId:'f5'},
    {id:'i40',nome:'Muffin chocolate',cat:'Padaria',fornId:'f5'},
    {id:'i41',nome:'Suíno',cat:'Carnes',fornId:'f5'},
    {id:'i42',nome:'Requeijão',cat:'Laticínios',fornId:'f6'},
    {id:'i43',nome:'Nata',cat:'Laticínios',fornId:'f6'},
    {id:'i44',nome:'Leite',cat:'Laticínios',fornId:'f6'},
    {id:'i45',nome:'Manteiga',cat:'Laticínios',fornId:'f6'},
    {id:'i46',nome:'Queijo muçarela',cat:'Laticínios',fornId:'f6'},
    {id:'i47',nome:'Balança para cozinha',cat:'Utensílios',fornId:'f7'},
  ],
  lista:[],
  historico:[]
};
// Semana passada no histórico
const semPassada=new Date(Date.now()-7*864e5).toISOString();
const qtdsDef={i01:'2 und',i02:'2 und',i38:'3 pct',i39:'2 cx',i40:'1 cx',i41:'1kg',i42:'1 balde',i43:'5 baldes',i44:'1 cx',i45:'5kg'};
DADOS_INICIAIS.insumos.forEach(ins=>{
  DADOS_INICIAIS.historico.push({id:uid(),insumoId:ins.id,qtd:qtdsDef[ins.id]||'',data:semPassada});
});

let dados=(() => {try{const s=localStorage.getItem('compras_app_v4');if(s)return JSON.parse(s);}catch(e){}return JSON.parse(JSON.stringify(DADOS_INICIAIS));})();
function salvar(){localStorage.setItem('compras_app_v4',JSON.stringify(dados))}

// ===== NAV =====
function ir(tela){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+tela).classList.add('active');
  document.getElementById('nav-'+tela).classList.add('active');
  if(tela==='lista')renderLista();
  if(tela==='dash')renderDash();
  if(tela==='cadastros')renderCadastros();
  if(tela==='historico')renderHistorico();
}
document.getElementById('topbar-date').textContent=hoje();

// ===== DASHBOARD =====
function renderDash(){
  const el=document.getElementById('dash-content');
  const agora=Date.now();
  const semana=7*864e5;

  // Itens na lista da semana (histórico últimos 7 dias)
  const hisSemana=dados.historico.filter(h=>agora-new Date(h.data)<semana);
  const qtdSemana=hisSemana.length;

  // Última compra registrada
  const ultimaCompra=[...dados.historico].sort((a,b)=>new Date(b.data)-new Date(a.data));
  let ultimaInfo='Nenhuma compra registrada';
  let ultimaDia='';
  if(ultimaCompra.length){
    const d=new Date(ultimaCompra[0].data);
    const mesmoDia=(h)=>{const hd=new Date(h.data);return hd.getDate()===d.getDate()&&hd.getMonth()===d.getMonth()&&hd.getFullYear()===d.getFullYear();};
    const doMesmoDia=dados.historico.filter(mesmoDia);
    const nomes=doMesmoDia.map(h=>{const i=dados.insumos.find(x=>x.id===h.insumoId);return i?i.nome:null;}).filter(Boolean);
    const diasAtras=Math.round((agora-d)/864e5);
    ultimaDia=diasAtras===0?'hoje':diasAtras===1?'ontem':`há ${diasAtras} dias (${fmtDia(ultimaCompra[0].data)})`;
    if(nomes.length<=3) ultimaInfo=nomes.join(', ');
    else ultimaInfo=nomes.slice(0,2).join(', ')+` e mais ${nomes.length-2}`;
  }

  // Concentração por fornecedor (histórico total)
  const contagem={};
  dados.historico.forEach(h=>{
    const ins=dados.insumos.find(i=>i.id===h.insumoId);
    const forn=ins?dados.fornecedores.find(f=>f.id===ins.fornId):null;
    const key=forn?forn.nome:'Sem fornecedor';
    contagem[key]=(contagem[key]||0)+1;
  });
  const total=Object.values(contagem).reduce((a,b)=>a+b,0)||1;
  const ranking=Object.entries(contagem).sort((a,b)=>b[1]-a[1]).slice(0,6);

  // Cores para barras
  const cores=['#2D6A4F','#40916C','#52B788','#74C69D','#95D5B2','#B7E4C7'];

  let html=`
  <div class="dash-grid">
    <div class="dash-card">
      <div class="dash-num">${qtdSemana}</div>
      <div class="dash-label">itens comprados esta semana</div>
    </div>
    <div class="dash-card">
      <div class="dash-num">${dados.lista.length}</div>
      <div class="dash-label">itens na lista hoje</div>
    </div>
  </div>`;

  if(ultimaCompra.length){
    html+=`<div class="dash-card-full">
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px">Última compra — ${ultimaDia}</div>
      <div style="font-size:14px;color:var(--text)">${ultimaInfo}</div>
    </div>`;
  }

  html+=`<div class="dash-card-full">
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:12px">Concentração por fornecedor</div>`;

  if(total===0||!ranking.length){
    html+=`<div style="font-size:13px;color:var(--muted)">Nenhum dado ainda.</div>`;
  } else {
    ranking.forEach(([nome,count],i)=>{
      const pct=Math.round(count/total*100);
      html+=`<div class="bar-row">
        <div class="bar-name" title="${nome}">${nome}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${cores[i]||cores[cores.length-1]}"></div></div>
        <div class="bar-pct">${pct}%</div>
      </div>`;
    });
  }
  html+=`</div>`;

  // Alertas de frequência
  const alertas=calcAlerts();
  if(alertas.length){
    html+=`<div class="dash-card-full" style="border-color:#F0D890;background:var(--warn-bg)">
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--warn);margin-bottom:10px">⚠ Insumos atrasados</div>`;
    alertas.forEach(a=>{
      html+=`<div style="font-size:13px;color:var(--text);margin-bottom:6px"><b>${a.nome}</b> — sem compra há ${a.dias} dias <span style="color:var(--muted)">(média: ${a.media} dias)</span></div>`;
    });
    html+=`</div>`;
  }

  el.innerHTML=html;
}

function calcAlerts(){
  const alerts=[];
  dados.insumos.forEach(ins=>{
    const reg=dados.historico.filter(h=>h.insumoId===ins.id).sort((a,b)=>new Date(b.data)-new Date(a.data));
    if(reg.length<2)return;
    const diffs=[];
    for(let i=0;i<reg.length-1;i++) diffs.push((new Date(reg[i].data)-new Date(reg[i+1].data))/864e5);
    const media=diffs.reduce((a,b)=>a+b,0)/diffs.length;
    const dias=(Date.now()-new Date(reg[0].data))/864e5;
    if(dias>media*1.3) alerts.push({nome:ins.nome,dias:Math.round(dias),media:Math.round(media)});
  });
  return alerts;
}

// ===== LISTA =====
function toggleGrupo(key){
  const info=document.getElementById('gi-'+key);
  const chev=document.getElementById('gc-'+key);
  if(info){info.classList.toggle('open');chev.classList.toggle('open');}
}

function renderLista(){
  const el=document.getElementById('lista-content');
  if(!dados.lista.length){
    el.innerHTML='<div class="empty">Lista vazia.<br>Toque em <b>+ Adicionar insumo</b> para começar.</div>';
    return;
  }
  const grupos={};
  dados.lista.forEach(item=>{
    const ins=dados.insumos.find(i=>i.id===item.insumoId);
    const forn=ins&&ins.fornId?dados.fornecedores.find(f=>f.id===ins.fornId):null;
    const key=forn?forn.id:'sem';
    if(!grupos[key])grupos[key]={forn,items:[]};
    grupos[key].items.push({item,ins});
  });
  const ordem=[...dados.fornecedores.map(f=>f.id),'sem'];
  let html='';
  Object.entries(grupos).sort((a,b)=>ordem.indexOf(a[0])-ordem.indexOf(b[0])).forEach(([key,g])=>{
    const nome=g.forn?g.forn.nome:'Sem fornecedor';
    const tel=g.forn&&g.forn.tel?g.forn.tel:'';
    const end=g.forn&&g.forn.end?g.forn.end:'';
    const temInfo=tel||end;
    html+=`<div class="group-header" onclick="${temInfo?`toggleGrupo('${key}')`:''}" style="${temInfo?'':'cursor:default'}">
      <div class="group-header-left">
        <span class="group-title">${nome}</span>
        <span class="group-count">${g.items.length}</span>
      </div>
      ${temInfo?`<span class="group-chevron" id="gc-${key}"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></span>`:''}
    </div>`;
    if(temInfo){
      html+=`<div class="group-info" id="gi-${key}">`;
      if(tel) html+=`<a href="tel:${tel}">📞 ${tel}</a>`;
      if(end) html+=`<a href="${end.startsWith('http')?end:'https://maps.google.com/?q='+encodeURIComponent(end)}" target="_blank">🗺 Ver no mapa</a>`;
      html+=`</div>`;
    }
    html+=`<div class="card" style="padding:8px 14px">`;
    g.items.forEach(({item,ins})=>{
      html+=`<div class="item-row">
        <div>
          <div style="font-size:14px;font-weight:500">${ins?ins.nome:'?'}</div>
          ${item.qtd?`<div style="font-size:12px;color:var(--muted)">${item.qtd}</div>`:''}
        </div>
        <button class="btn btn-danger" onclick="removerItem('${item.id}')">✕</button>
      </div>`;
    });
    html+='</div>';
  });
  el.innerHTML=html;
}

function removerItem(id){dados.lista=dados.lista.filter(i=>i.id!==id);salvar();renderLista()}

// ===== AUTOCOMPLETE =====
let acSelecionado=null,acAtivo=-1,acUltimaQuery='';
const acInput=document.getElementById('ac-input');
const acDropdown=document.getElementById('ac-dropdown');
const acBox=document.getElementById('ac-box');
const acClear=document.getElementById('ac-clear');

function highlight(texto,query){
  if(!query)return texto;
  const re=new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return texto.replace(re,'<mark>$1</mark>');
}

function renderDropdown(query){
  const q=norm(query);acUltimaQuery=query;
  if(!q){acDropdown.classList.remove('open');return;}
  let res=dados.insumos.filter(i=>norm(i.nome).includes(q));
  res.sort((a,b)=>{const s=norm(a.nome).startsWith(q)?0:1,t=norm(b.nome).startsWith(q)?0:1;return s-t||a.nome.localeCompare(b.nome,'pt');});
  if(!res.length){
    acDropdown.innerHTML=`<div class="ac-empty">Nenhum insumo encontrado.<br><span style="color:var(--accent);cursor:pointer" onclick="abrirModalInsumoCom('${query.replace(/'/g,"\\'")}')">+ Cadastrar "${query}"</span></div>`;
    acDropdown.classList.add('open');acAtivo=-1;return;
  }
  const grupos={};
  res.forEach(i=>{
    const forn=i.fornId?dados.fornecedores.find(f=>f.id===i.fornId):null;
    const key=forn?forn.id:'sem';
    const nome=forn?forn.nome:'Sem fornecedor';
    if(!grupos[key])grupos[key]={nome,items:[]};
    grupos[key].items.push(i);
  });
  const ordem=[...dados.fornecedores.map(f=>f.id),'sem'];
  let html='';
  Object.entries(grupos).sort((a,b)=>ordem.indexOf(a[0])-ordem.indexOf(b[0])).forEach(([,g])=>{
    html+=`<div class="ac-group-label">${g.nome}</div>`;
    g.items.forEach(i=>{
      html+=`<div class="ac-item" data-id="${i.id}" onmousedown="selecionarItem('${i.id}')"><span>${highlight(i.nome,query)}</span><span class="ac-item-forn">${i.cat||''}</span></div>`;
    });
  });
  acDropdown.innerHTML=html;acDropdown.classList.add('open');acAtivo=-1;
}

acInput.addEventListener('input',()=>{
  acSelecionado=null;acBox.classList.remove('selected');acClear.style.display='none';
  document.getElementById('forn-pill-wrap').innerHTML='';
  renderDropdown(acInput.value);
});
acInput.addEventListener('focus',()=>{acBox.classList.add('focused');if(acInput.value&&!acSelecionado)renderDropdown(acInput.value);});
acInput.addEventListener('blur',()=>{acBox.classList.remove('focused');setTimeout(()=>acDropdown.classList.remove('open'),150);});
acInput.addEventListener('keydown',e=>{
  const items=acDropdown.querySelectorAll('.ac-item');
  if(e.key==='ArrowDown'){e.preventDefault();acAtivo=Math.min(acAtivo+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('active',i===acAtivo));}
  else if(e.key==='ArrowUp'){e.preventDefault();acAtivo=Math.max(acAtivo-1,0);items.forEach((el,i)=>el.classList.toggle('active',i===acAtivo));}
  else if(e.key==='Enter'&&acAtivo>=0){e.preventDefault();const el=items[acAtivo];if(el)selecionarItem(el.dataset.id);}
  else if(e.key==='Escape')acDropdown.classList.remove('open');
});

function selecionarItem(id){
  const ins=dados.insumos.find(i=>i.id===id);if(!ins)return;
  acSelecionado=ins;acInput.value=ins.nome;acBox.classList.add('selected');acClear.style.display='flex';
  acDropdown.classList.remove('open');
  const forn=ins.fornId?dados.fornecedores.find(f=>f.id===ins.fornId):null;
  document.getElementById('forn-pill-wrap').innerHTML=forn
    ?`<div class="forn-pill">🏪 ${forn.nome}</div>`
    :`<div class="forn-pill" style="background:#F5F2ED;border-color:var(--border);color:var(--muted)">Sem fornecedor definido</div>`;
  document.getElementById('inp-qtd').focus();
}

function limparSelecao(){
  acSelecionado=null;acInput.value='';acBox.classList.remove('selected');acClear.style.display='none';
  document.getElementById('forn-pill-wrap').innerHTML='';acDropdown.classList.remove('open');acInput.focus();
}

// ===== MODAL ADICIONAR =====
function abrirModalAdicionar(){
  limparSelecao();document.getElementById('inp-qtd').value='';
  abrirModal('modal-adicionar');setTimeout(()=>acInput.focus(),250);
}

function adicionarItem(){
  if(!acSelecionado){
    // Se digitou algo mas não selecionou, permite adicionar como texto livre
    const texto=acInput.value.trim();
    if(!texto)return;
    // Verifica se existe insumo exato
    const exato=dados.insumos.find(i=>norm(i.nome)===norm(texto));
    if(exato){selecionarItem(exato.id);return;}
    acInput.style.boxShadow='0 0 0 2px var(--danger)';
    setTimeout(()=>acInput.style.boxShadow='',800);
    return;
  }
  const qtd=document.getElementById('inp-qtd').value.trim();
  dados.lista.push({id:uid(),insumoId:acSelecionado.id,qtd,data:new Date().toISOString()});
  dados.historico.push({id:uid(),insumoId:acSelecionado.id,qtd,data:new Date().toISOString()});
  salvar();fecharModal('modal-adicionar');renderLista();
}

// ===== ROTA =====
function abrirRota(){
  if(!dados.lista.length){alert('A lista está vazia.');return;}
  const enderecos=new Set();
  dados.lista.forEach(item=>{
    const ins=dados.insumos.find(i=>i.id===item.insumoId);
    if(!ins||!ins.fornId)return;
    const forn=dados.fornecedores.find(f=>f.id===ins.fornId);
    if(forn&&forn.end&&forn.end.trim())enderecos.add(forn.end.trim());
  });
  const wp=[...enderecos];
  if(!wp.length){alert('Cadastre os endereços dos fornecedores para gerar rota.');return;}
  const dest=wp.pop();
  const wStr=wp.length?'&waypoints='+wp.map(encodeURIComponent).join('|'):'';
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}${wStr}&travelmode=driving`,'_blank');
}

// ===== CADASTROS =====
function renderCadastros(){
  let h='';
  dados.fornecedores.forEach(f=>{
    const count=dados.insumos.filter(i=>i.fornId===f.id).length;
    h+=`<div class="card-sm" style="margin:0 0 8px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="flex:1;min-width:0;cursor:pointer" onclick="editarFornecedor('${f.id}')">
          <div style="font-size:14px;font-weight:500">${f.nome}</div>
          <div style="font-size:12px;color:var(--muted)">${count} insumo${count!==1?'s':''}${f.tel?' · '+f.tel:''}${f.end?' · <span style="color:var(--accent)">📍 endereço</span>':''}</div>
        </div>
        <button class="btn btn-danger" onclick="event.stopPropagation();excluirFornecedor('${f.id}')">✕</button>
      </div>
    </div>`;
  });
  if(!h)h='<div class="empty" style="padding:20px 0">Nenhum fornecedor.</div>';
  document.getElementById('lista-fornecedores').innerHTML=h;

  let h2='';
  // Insumos sem fornecedor primeiro se houver
  const semForn=dados.insumos.filter(i=>!i.fornId||!dados.fornecedores.find(f=>f.id===i.fornId));
  if(semForn.length){
    h2+=`<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 0 6px">Sem fornecedor definido</div>`;
    semForn.forEach(i=>{
      h2+=`<div class="card-sm" style="margin:0 0 6px;display:flex;align-items:center;justify-content:space-between">
        <div><span style="font-size:14px;font-weight:500">${i.nome}</span>${i.cat?`<span style="font-size:11px;color:var(--muted);margin-left:6px">${i.cat}</span>`:''}</div>
        <button class="btn btn-danger" onclick="excluirInsumo('${i.id}')">✕</button>
      </div>`;
    });
  }
  dados.fornecedores.forEach(f=>{
    const ins=dados.insumos.filter(i=>i.fornId===f.id);
    if(!ins.length)return;
    h2+=`<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 6px">${f.nome}</div>`;
    ins.forEach(i=>{
      h2+=`<div class="card-sm" style="margin:0 0 6px;display:flex;align-items:center;justify-content:space-between">
        <div><span style="font-size:14px;font-weight:500">${i.nome}</span>${i.cat?`<span style="font-size:11px;color:var(--muted);margin-left:6px">${i.cat}</span>`:''}</div>
        <button class="btn btn-danger" onclick="excluirInsumo('${i.id}')">✕</button>
      </div>`;
    });
  });
  if(!h2)h2='<div class="empty" style="padding:20px 0">Nenhum insumo.</div>';
  document.getElementById('lista-insumos-cad').innerHTML=h2;
}

let editandoFornId=null;
function abrirModalFornecedor(id){
  editandoFornId=id||null;
  const f=id?dados.fornecedores.find(x=>x.id===id):null;
  document.getElementById('forn-nome').value=f?f.nome:'';
  document.getElementById('forn-tel').value=f?f.tel:'';
  document.getElementById('forn-end').value=f?f.end:'';
  document.getElementById('modal-forn-title').textContent=id?'Editar fornecedor':'Novo fornecedor';
  abrirModal('modal-fornecedor');
}
function editarFornecedor(id){abrirModalFornecedor(id)}
function salvarFornecedor(){
  const nome=document.getElementById('forn-nome').value.trim();if(!nome)return;
  const tel=document.getElementById('forn-tel').value.trim();
  const end=document.getElementById('forn-end').value.trim();
  if(editandoFornId){const f=dados.fornecedores.find(x=>x.id===editandoFornId);if(f){f.nome=nome;f.tel=tel;f.end=end;}}
  else dados.fornecedores.push({id:uid(),nome,tel,end});
  salvar();fecharModal('modal-fornecedor');renderCadastros();
}
function excluirFornecedor(id){
  if(!confirm('Excluir este fornecedor?'))return;
  dados.fornecedores=dados.fornecedores.filter(f=>f.id!==id);
  salvar();renderCadastros();
}

function abrirModalInsumo(){abrirModalInsumoCom('');}
function abrirModalInsumoCom(nome){
  document.getElementById('ins-nome').value=nome;
  document.getElementById('ins-cat').value='';
  const sel=document.getElementById('ins-forn');
  sel.innerHTML='<option value="">Sem fornecedor por enquanto</option>';
  dados.fornecedores.forEach(f=>sel.innerHTML+=`<option value="${f.id}">${f.nome}</option>`);
  fecharModal('modal-adicionar');
  abrirModal('modal-insumo');
  setTimeout(()=>document.getElementById('ins-nome').focus(),250);
}
function salvarInsumo(){
  const nome=document.getElementById('ins-nome').value.trim();if(!nome)return;
  const novoInsumo={id:uid(),nome,cat:document.getElementById('ins-cat').value.trim(),fornId:document.getElementById('ins-forn').value||null};
  dados.insumos.push(novoInsumo);
  salvar();fecharModal('modal-insumo');renderCadastros();
  if(acUltimaQuery){setTimeout(()=>{abrirModalAdicionar();setTimeout(()=>selecionarItem(novoInsumo.id),100);},100);}
}
function excluirInsumo(id){
  if(!confirm('Excluir este insumo?'))return;
  dados.insumos=dados.insumos.filter(i=>i.id!==id);salvar();renderCadastros();
}

// ===== HISTÓRICO =====
function renderHistorico(){
  const el=document.getElementById('historico-content');
  if(!dados.historico.length){el.innerHTML='<div class="empty">Sem histórico ainda.</div>';return;}
  const grupos={};
  [...dados.historico].sort((a,b)=>new Date(b.data)-new Date(a.data)).forEach(h=>{
    const d=new Date(h.data);
    const key=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    const label=`${diasSemana[d.getDay()]}, ${d.getDate()} de ${meses[d.getMonth()]}`;
    if(!grupos[key])grupos[key]={label,items:[]};
    grupos[key].items.push(h);
  });
  let html='<div style="padding-top:12px">';
  Object.values(grupos).forEach(g=>{
    html+=`<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px">${g.label}</div>`;
    g.items.forEach(h=>{
      const ins=dados.insumos.find(i=>i.id===h.insumoId);
      const forn=ins&&ins.fornId?dados.fornecedores.find(f=>f.id===ins.fornId):null;
      html+=`<div class="card-sm" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">
        <div>
          <div style="font-size:14px;font-weight:500">${ins?ins.nome:'—'}</div>
          <div style="font-size:11px;color:var(--muted)">${forn?forn.nome:'Sem fornecedor'}${h.qtd?' · '+h.qtd:''}</div>
        </div>
      </div>`;
    });
  });
  html+='</div>';
  el.innerHTML=html;
}

// ===== MODAIS =====
function abrirModal(id){document.getElementById(id).classList.add('open')}
function fecharModal(id){document.getElementById(id).classList.remove('open')}
document.querySelectorAll('.modal-overlay').forEach(el=>{
  el.addEventListener('click',e=>{if(e.target===el)fecharModal(el.id);});
});

renderLista();
</script>
